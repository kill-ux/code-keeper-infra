image:
  name: alpine/terragrunt:tf1.15.8
  entrypoint: [""]

stages:
  - init
  - validate
  - plan
  - apply_staging
  - apply_production
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_DOWNLOAD_DIR: "$CI_PROJECT_DIR/.terragrunt-cache"

cache:
  key: terraform-providers
  paths:
    - .terragrunt-cache/

init_staging:
  stage: init
  script:
    - terragrunt run --all --working-dir staging init

init_production:
  stage: init
  script:
    - terragrunt run --all --working-dir production init

validate_staging:
  stage: validate
  needs:
    - init_staging
  script:
    - terragrunt run --all --working-dir staging validate

validate_production:
  stage: validate
  needs:
    - init_production
  script:
    - terragrunt run --all --working-dir production validate

plan_staging:
  stage: plan
  needs:
    - validate_staging
  script:
    - terragrunt plan --all --working-dir staging -out="$CI_PROJECT_DIR/staging.tfplan"
  artifacts:
    expire_in: 1 week
    paths:
      - staging.tfplan

plan_production:
  stage: plan
  needs:
    - validate_production
  script:
    - terragrunt plan --all --working-dir production -out="$CI_PROJECT_DIR/production.tfplan"
  artifacts:
    expire_in: 1 week
    paths:
      - production.tfplan

apply_staging:
  stage: apply_staging
  needs:
    - job: plan_staging
      artifacts: true
  resource_group: terraform-staging
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual
  script:
    - terragrunt apply --all --working-dir staging "$CI_PROJECT_DIR/staging.tfplan"

apply_production:
  stage: apply_production
  needs:
    - job: plan_production
      artifacts: true
    - job: apply_staging
  resource_group: terraform-production
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual
  script:
    - terragrunt apply --all --working-dir production "$CI_PROJECT_DIR/production.tfplan"

destroy_staging:
  stage: destroy
  resource_group: terraform-staging
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual
  script:
    - terragrunt destroy --working-dir staging/workload