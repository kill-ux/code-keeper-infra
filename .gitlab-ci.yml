image:
  name: alpine/terragrunt:tf1.15.8
  entrypoint: [""]

stages:
  - init
  - validate
  - plan
  - apply_staging
  - apply_production
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_DOWNLOAD_DIR: "$CI_PROJECT_DIR/.terragrunt-cache"

cache:
  key: terraform-providers
  paths:
    - .terragrunt-cache/

init_staging:
  stage: init
  script:
    - terragrunt run --all --working-dir staging init
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

init_production:
  stage: init
  script:
    - terragrunt run --all --working-dir production init
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

validate_staging:
  stage: validate
  needs:
    - init_staging
  script:
    - terragrunt run --all --working-dir staging validate
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

validate_production:
  stage: validate
  needs:
    - init_production
  script:
    - terragrunt run --all --working-dir production validate
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

.bootstrap_check:
  before_script: 
    - |
      if terragrunt state list --working-dir ${TG_WORKING_DIR}/workload 2>/dev/null | grep -q "aws_ecs_task_definition.task"; then
        export TF_VAR_bootstrap=false
      else
        export TF_VAR_bootstrap=true
      fi


plan_staging:
  stage: plan
  needs:
    - validate_staging
  variables:
    TG_WORKING_DIR: staging
  before_script:
    - !reference [.bootstrap_check, before_script]
  script:
    - terragrunt plan --working-dir staging/foundation -out="$CI_PROJECT_DIR/staging.foundation.tfplan"
    - terragrunt plan --working-dir staging/workload
  artifacts:
    expire_in: 1 week
    paths:
      - staging.foundation.tfplan
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

plan_production:
  stage: plan
  needs:
    - validate_production
  variables:
    TG_WORKING_DIR: production
  before_script:
    - !reference [.bootstrap_check, before_script]
  script:
    - terragrunt plan --working-dir production/foundation -out="$CI_PROJECT_DIR/production.foundation.tfplan"
    - terragrunt plan --working-dir production/workload
  artifacts:
    expire_in: 1 week
    paths:
      - production.foundation.tfplan
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"

apply_staging:
  stage: apply_staging
  timeout: 30m
  needs:
    - job: plan_staging
      artifacts: true
  variables:
    TG_WORKING_DIR: staging
  before_script:
    - !reference [.bootstrap_check, before_script]
  resource_group: terraform-staging
  script:
    - terragrunt apply --working-dir staging/foundation -auto-approve "$CI_PROJECT_DIR/staging.foundation.tfplan"
    - terragrunt apply --working-dir staging/workload -auto-approve
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual

apply_production:
  stage: apply_production
  timeout: 30m
  needs:
    - job: plan_production
    - job: apply_staging
  variables:
    TG_WORKING_DIR: staging
  before_script:
    - !reference [.bootstrap_check, before_script]
  resource_group: terraform-production
  script:
    - terragrunt apply --working-dir production/foundation -auto-approve "$CI_PROJECT_DIR/production.foundation.tfplan"
    - terragrunt apply --working-dir production/workload -auto-approve
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual

destroy_staging:
  stage: destroy
  resource_group: terraform-staging
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual
      allow_failure: true
  script:
    - terragrunt destroy --working-dir staging/workload -auto-approve

destroy_production:
  stage: destroy
  resource_group: terraform-production
  rules:
    - if: "$CI_COMMIT_REF_PROTECTED"
      when: manual
      allow_failure: true
  script:
    - terragrunt destroy --working-dir production/workload -auto-approve
